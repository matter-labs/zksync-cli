name: Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to release"
        required: true
        default: "main"

permissions:
  contents: write
  issues: write # semantic-release comments on released issues and opens failure issues
  pull-requests: write # semantic-release comments on released PRs
  id-token: write # Required for OIDC
  
env:
  HUSKY: 0
  CI: true
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: production release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.x" # semantic-release 25 needs Node ^22.14 || >=24.10, npm trusted publishing needs npm >=11.5.1
      - name: Install dependencies and build
        run: npm ci && npm run build
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
